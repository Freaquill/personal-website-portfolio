<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fadly Ahmad Firdausy — B2B Presales · Product · IoT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">

<style>
  :root {
    /* Swiss / International — light default. Single red accent. Flat. */
    --accent: #E5322A;
    --accent-soft: rgba(229, 50, 42, 0.10);
    --accent-line: rgba(229, 50, 42, 0.42);

    --bg: #F4F1EA;
    --bg-2: #EDE9DF;
    --surface: #F4F1EA;
    --surface-2: #ECE7DC;
    --line: rgba(22,20,15,0.16);
    --line-strong: rgba(22,20,15,0.34);

    --ink: #16140F;
    --ink-2: #3A3730;
    --ink-3: #6B6760;
    --ink-4: #9A958C;

    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Geist', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;

    --maxw: 1280px;
    --gutter: clamp(20px, 4vw, 56px);
    --section-y: clamp(76px, 9vw, 140px);
    --radius: 0px;
    --radius-lg: 0px;
  }

  [data-theme="dark"] {
    --bg: #121110;
    --bg-2: #1A1815;
    --surface: #141210;
    --surface-2: #1E1B17;
    --line: rgba(255,255,255,0.16);
    --line-strong: rgba(255,255,255,0.32);
    --ink: #F2EFE9;
    --ink-2: #CAC6BD;
    --ink-3: #938E85;
    --ink-4: #6A655D;
    --accent: #FF5A47;
    --accent-soft: rgba(255, 90, 71, 0.12);
    --accent-line: rgba(255, 90, 71, 0.44);
  }

  [data-density="compact"] {
    --section-y: clamp(56px, 7vw, 96px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  ::selection { background: var(--accent); color: #fff; }

  /* Reveal animation */
  .reveal {
    opacity: 1;
    transform: none;
    transition: opacity 0.7s cubic-bezier(.2,.7,.2,1), transform 0.7s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; transform: none; opacity: 1; }
    * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
  }

  /* Swiss: flat surfaces, no grain texture */
  body::before { display: none; }

  /* Loading state while React mounts */
  .boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--bg);
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 999;
    transition: opacity .4s ease;
  }
  .boot.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="boot" id="boot">Loading portfolio…</div>

  <script>
    // EDITMODE state — tweakable defaults
    window.__TWEAK_DEFAULTS__ = /*EDITMODE-BEGIN*/{
      "accent": "#E5322A",
      "theme": "light",
      "density": "comfortable"
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="dist/portfolio.js?v=6"></script>
</body>
</html>
